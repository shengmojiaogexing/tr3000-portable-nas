# 443 端口 SNI 透明分流示例：标准 HTTPS 网站与其他 443 TCP/TLS 服务共存
stream {
    map $ssl_preread_server_name $backend_443 {
        booking.example.com        127.0.0.1:10443;
        studio.booking.example.com 127.0.0.1:10443;
        nas.example.com            127.0.0.1:10443;
        studio.nas.example.com     127.0.0.1:10443;
        panel.nas.example.com      127.0.0.1:10443;
        default                    127.0.0.1:4443;
    }

    server {
        listen 0.0.0.0:443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend_443;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
    }
}
